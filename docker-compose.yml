services:
#Definimos el servicio Web, en este caso Odoo
  odoo_sergio:
    #Indicamos que imagen de Docker Hub utilizaremos
    image: odoo:20
    container_name: odoo_sergio
    # Esperamos a que PostgreSQL acepte conexiones (no solo a que arranque el contenedor)
    depends_on:
      postgres_sergio:
        condition: service_healthy

    # Port Mapping: el puerto 8069 del contenedor se mapea con el mismo puerto en el anfitrión
    # Permitiendo acceder a Odoo mediante http://localhost:8069
    ports:
      - 8069:8069

    # Mapeamos directorios del contenedor en directorios locales (./data/...)
    volumes:
      - ./data/addons:/mnt/extra-addons
      - ./data/odoo_config:/etc/odoo
      - ./data/odoo/filestore:/var/lib/odoo/filestore
      - ./data/odoo/sessions:/var/lib/odoo/sessions
    #Indicamos que el contenedor funcionará con usuario root y no con usuario odoo
    user: root
    # Variables de entorno de Odoo (odoo.conf tiene prioridad sobre ellas)
    environment:
      - HOST=postgres_sergio
      - USER=odoo
      - PASSWORD=odoo
    # Parámetros al arrancar Odoo
    command: -c /etc/odoo/odoo.conf --dev=all
    networks:
      - network_sergio

#Definimos el servicio de la base de datos
  postgres_sergio:
    # Odoo 20 exige PostgreSQL >= 16.
    # NO usar postgres:18 con este montaje: la 18 cambia la ruta interna de datos.
    image: postgres:17
    container_name: postgres_sergio
    # Permitiendo acceder a la base de datos desde el host
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_DB=postgres
    volumes:
      - ./data/dataPostgreSQL:/var/lib/postgresql/data
      - ./data/backups:/backups                 # Backups de la base de datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - network_sergio

networks:
  network_sergio:
    driver: bridge